# Set these on the laptop before running Kamal; see docs/deployment.md.
service: webtech_wheelhouse
image: <%= "#{ENV.fetch('KAMAL_REGISTRY_USERNAME')}/webtech_wheelhouse".to_json %>

servers:
  web:
    - <%= ENV.fetch("WHEELHOUSE_HOST").to_json %>

# The lab uses the server's public IP over HTTP, without a domain or certificate.
# Rails' matching HTTP settings are configured separately in production.rb.
proxy:
  ssl: false
  host: <%= ENV.fetch("WHEELHOUSE_HOST").to_json %>
  app_port: 80
  healthcheck:
    path: /up

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME").to_json %>
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: ubuntu
  keys:
    - <%= ENV.fetch("WHEELHOUSE_SSH_KEY").to_json %>
  keys_only: true
  forward_agent: false

env:
  secret:
    - RAILS_MASTER_KEY
    - WEBTECH_WHEELHOUSE_DATABASE_PASSWORD
  clear:
    APP_HOST: <%= ENV.fetch("WHEELHOUSE_HOST").to_json %>
    DB_HOST: webtech_wheelhouse-db
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 1

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Active Storage originals and variants live outside the application container.
volumes:
  - "webtech_wheelhouse_storage:/rails/storage"

asset_path: /rails/public/assets
deploy_timeout: 180

# The selected EC2 instance is x86-64. Build locally with Docker Buildx.
builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("WHEELHOUSE_HOST").to_json %>
    network: kamal
    # No host port is published; Rails reaches PostgreSQL over the Kamal network.
    env:
      clear:
        POSTGRES_USER: webtech_wheelhouse
        POSTGRES_DB: webtech_wheelhouse_production
      secret:
        - POSTGRES_PASSWORD:WEBTECH_WHEELHOUSE_DATABASE_PASSWORD
    # PostgreSQL 18's data directory is inside this version-independent mount.
    volumes:
      - "webtech_wheelhouse_postgres:/var/lib/postgresql"
